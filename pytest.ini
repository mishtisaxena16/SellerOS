[pytest]
# Without this, every `async def test_...` in tests/test_integration_e2e.py
# (and the new backend/tests/test_marketplace_negative.py-adjacent async
# tests, if any are added later) silently doesn't run under plain
# `pytest` -- pytest-asyncio's default "strict" mode requires either an
# explicit @pytest.mark.asyncio on every async test, or this. auto mode
# means both styles work: files that already set `pytestmark =
# pytest.mark.asyncio` are unaffected, and any future async test doesn't
# need to remember to add one.
asyncio_mode = auto

# Run both test suites together from the SellerOS/ root:
#   tests/    -- Memory Layer unit tests + AI runtime integration tests
#   backend/  -- auth unit tests (backend/auth/test_*.py) and the
#                marketplace negative-path suite (backend/tests/)
# backend/ai/memory_layer/ has its own separate pytest.ini
# (testpaths = tests, relative to memory_layer/) for running that
# suite in isolation; this one is for the whole project.
testpaths =
    tests
    backend
